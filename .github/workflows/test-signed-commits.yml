name: Signed commit helper tests

on:
  pull_request:
    paths:
      - ".github/scripts/commit-signed-changes.py"
      - ".github/scripts/test_commit_signed_changes.py"
      - ".github/workflows/test-signed-commits.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/commit-signed-changes.py"
      - ".github/scripts/test_commit_signed_changes.py"
      - ".github/workflows/test-signed-commits.yml"

permissions:
  contents: read

jobs:
  signed-commit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test staged changes and commit failure handling
        run: python3 .github/scripts/test_commit_signed_changes.py
